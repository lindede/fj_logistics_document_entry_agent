<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>单证录入智能体</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">FJ Logistics · Document Entry Agent</div>
      <div class="stepper" id="stepper">
        <div class="step" data-step="Idle">空闲</div>
        <div class="step" data-step="Processing">处理中</div>
        <div class="step" data-step="Await">待确认</div>
        <div class="step" data-step="Done">完成</div>
      </div>
    </header>

    <main class="main" id="main"></main>

    <footer>
      <div class="composer" id="composer">
        <label class="btn secondary" for="file">PDF</label>
        <input id="file" type="file" accept="application/pdf" />
        <input id="cmd" type="text" placeholder="输入指令，或拖入 PDF…" />
        <button id="send" type="button">发送</button>
      </div>
      <div class="msg" id="msg"></div>
    </footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
